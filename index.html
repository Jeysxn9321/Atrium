:root{
  --bg:#0b0b0d; --panel:#16161a; --panel2:#1f1f25; --line:rgba(255,255,255,.1);
  --text:#f2f2f3; --dim:#a9a9b2; --faint:#6f6f7a; --red:#e50914; --red2:#f6121d;
  --pad:3.6rem;
  --display:"Bebas Neue","Bahnschrift","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{font-size:clamp(min(9px,100vw / 112),min(100vh / 72,100vw / 128),64px);background:var(--bg)}
/* text and buttons follow the window: its height, or its width when it is narrower than 16:9 */
@media (min-aspect-ratio:3/1){:root{--pad:3vw}}
body{margin:0;color:var(--text);font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  background:var(--bg);overflow-x:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
img{display:block}
::-webkit-scrollbar{width:.8rem;height:0}
::-webkit-scrollbar-thumb{background:#33333c;border-radius:1rem}

/* ---------- top bar ---------- */
#top{position:fixed;inset:0 0 auto 0;height:5.4rem;z-index:30;display:flex;align-items:center;gap:2.4rem;
  padding:0 var(--pad);transition:background .3s;background:linear-gradient(#000a,#0000)}
#top.solid{background:#0b0b0df2;backdrop-filter:blur(12px)}
#brand{font-family:var(--display);font-weight:400;letter-spacing:.045em;font-size:3.3rem;line-height:.9;padding-top:.25rem;color:var(--red);margin-right:1rem;cursor:pointer}
#tabs{display:flex;gap:2.2rem}
#tabs button{font-size:1.33rem;color:var(--dim);padding:.4rem 0;border-bottom:2px solid transparent;transition:color .15s}
#tabs button:hover{color:var(--text)}
#tabs button.on{color:var(--text);font-weight:600;border-color:var(--red)}
#search{margin-left:auto;display:flex;align-items:center;gap:.6rem;background:#0008;border:1px solid var(--line);
  border-radius:2rem;padding:.6rem 1.2rem;width:28rem;transition:border-color .15s,background .15s}
#search:focus-within{border-color:#fff8;background:#000c}
#search svg{width:1.4rem;height:1.4rem;flex:none;opacity:.7}
#search input{all:unset;flex:1;font-size:1.3rem;user-select:text}
#search input::placeholder{color:var(--faint)}
.tb{flex:none;width:2.8rem;height:2.8rem;margin-left:-1.2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--dim);transition:color .15s,background .15s}
.tb:hover{color:#fff;background:#fff2}
.tb.on{color:#fff;background:#fff3}
.tb svg{width:1.5rem;height:1.5rem}
#updBtn{flex:none;margin-left:-.4rem;padding:.5rem 1.2rem;border-radius:2rem;background:var(--red);color:#fff;font:inherit;font-size:1.15rem;font-weight:700;
  display:flex;align-items:center;gap:.5rem;cursor:pointer;animation:updIn .5s ease}
#updBtn[hidden]{display:none}
#updBtn:hover{filter:brightness(1.15)}
#updBtn[disabled]{opacity:.75;cursor:default;filter:none}
@keyframes updIn{from{opacity:0;transform:scale(.8)}}
#closeBtn{display:none}
:fullscreen #closeBtn{display:flex}

/* ---------- hero ---------- */
#hero{position:relative;height:min(66vh,52vw);min-height:30rem;overflow:hidden;background:#000}
#hero .glow{position:absolute;inset:-12%;background-size:cover;background-position:center 25%;
  filter:blur(5rem) saturate(1.3) brightness(.55);transform:scale(1.1)}
#hero .art{position:absolute;top:0;right:0;height:100%;width:min(100%,calc(66vh * 2.7));
  background-size:cover;background-position:center 22%;
  -webkit-mask-image:linear-gradient(90deg,#0000 0,#000 34%);mask-image:linear-gradient(90deg,#0000 0,#000 34%)}
#hero .vid{position:absolute;top:0;right:0;height:100%;width:min(100%,calc(66vh * 2.7));overflow:hidden;opacity:0;pointer-events:none;
  transition:opacity 1.2s;-webkit-mask-image:linear-gradient(90deg,#0000 0,#000 34%);mask-image:linear-gradient(90deg,#0000 0,#000 34%)}
#hero .vid.on.go{opacity:1}
#hero .vid iframe{position:absolute;left:0;top:50%;width:100%;aspect-ratio:16/9;border:0;transform:translateY(-50%) scale(1.16)}
#hero .shade{position:absolute;inset:0;background:
  linear-gradient(90deg,#0b0b0dcc 0,#0b0b0d66 28%,#0b0b0d00 60%),
  linear-gradient(0deg,var(--bg) 0,#0b0b0d00 34%)}
#hero .info{position:absolute;left:var(--pad);bottom:13%;width:min(56rem,46vw)}
#hero .glow,#hero .art,#hero .info{animation:heroIn .8s}
@keyframes heroIn{from{opacity:0}}
#hero .logo{max-width:30rem;max-height:11rem;object-fit:contain;object-position:left bottom;margin-bottom:1.4rem;
  filter:drop-shadow(0 .2rem 1rem #000a)}
#hero h1{font-family:var(--display);font-size:6.2rem;line-height:.95;letter-spacing:.015em;margin:0 0 1.2rem;font-weight:400;text-shadow:0 .2rem 1.4rem #000}
.metaline{display:flex;flex-wrap:wrap;align-items:center;gap:.9rem;color:var(--dim);font-size:1.3rem;margin-bottom:.9rem}
.metaline .rate{color:#f5c518;font-weight:700}
.metaline .tag{border:1px solid #fff5;border-radius:.3rem;padding:0 .45rem;font-size:1.07rem;color:var(--text)}
#hero p{font-size:1.46rem;line-height:1.5;color:#e4e4e8;margin:0 0 1.6rem;text-shadow:0 .1rem .8rem #000;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#hero.playing p{-webkit-line-clamp:2}
#hero .dots{position:absolute;right:var(--pad);bottom:15%;display:flex;gap:.5rem;align-items:center}
#hero .dots i{width:1.6rem;height:.32rem;border-radius:1rem;background:#fff5;cursor:pointer;transition:background .2s,width .2s}
#hero .dots i:hover{background:#fffa}
#hero .dots i.on{width:2.8rem;background:#fff}
#hero .snd{position:absolute;right:var(--pad);bottom:20%;z-index:3}
.snd[hidden]{display:none!important}
#peek .pic .snd{position:absolute;right:1rem;bottom:1rem;z-index:2;width:2.6rem;height:2.6rem}
#peek .pic .snd svg{width:1.2rem;height:1.2rem}
#sheet .banner .snd{position:absolute;right:2.4rem;bottom:2.6rem;z-index:2}
.btns{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.8rem;height:3.9rem;padding:0 2.2rem;border-radius:.5rem;white-space:nowrap;
  font-size:1.49rem;font-weight:700;transition:transform .12s,background .15s,filter .15s}
.btn svg{width:1.8rem;height:1.8rem}
.btn:active{transform:scale(.97)}
.btn.play{background:#fff;color:#000}.btn.play:hover{background:#ffffffd0}
.btn.more{background:#6d6d6eb3;color:#fff}.btn.more:hover{background:#6d6d6e80}
.btn.small{height:2.6rem;padding:0 1.2rem;font-size:1.3rem}
.rb{flex:none;width:3.2rem;height:3.2rem;border-radius:50%;border:2px solid #fff8;background:#2a2a2ecc;display:flex;align-items:center;
  justify-content:center;transition:border-color .15s,background .15s,transform .12s}
.rb svg{width:1.5rem;height:1.5rem}
.rb:hover{border-color:#fff;background:#3a3a40}
.rb:active{transform:scale(.94)}
.rb.main{background:#fff;color:#000;border-color:#fff}.rb.main:hover{background:#ffffffd0}
.rb.end{margin-left:auto}

/* ---------- rows ---------- */
#rows{position:relative;z-index:2;margin-top:-5.5rem;padding-bottom:6rem}
#rows.flat{margin-top:7.4rem}
.row{margin-bottom:2.6rem;position:relative}
.row h2{font-size:1.68rem;font-weight:700;margin:0 0 .8rem var(--pad);color:#ececf0}
.row h2 small{font-weight:400;color:var(--faint);font-size:1.23rem;margin-left:.8rem}
.strip{display:flex;gap:.7rem;overflow-x:auto;overflow-y:visible;scroll-behavior:smooth;
  padding:1.2rem var(--pad);margin:-1.2rem 0;scroll-padding:0 var(--pad)}
.arrow{position:absolute;top:2.2rem;bottom:0;width:var(--pad);z-index:5;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s;background:linear-gradient(90deg,#0b0b0de6,#0b0b0d00)}
.arrow.r{right:0;background:linear-gradient(270deg,#0b0b0de6,#0b0b0d00)}
.arrow.l{left:0}
.row:hover .arrow{opacity:1}
.arrow svg{display:none} .arrow{cursor:default}
.arrow:hover svg{transform:scale(1.25)}

.card{flex:none;position:relative;border-radius:.45rem;background:var(--panel);cursor:pointer;
  transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s;outline:0}
.card:hover,.card:focus-visible{transform:scale(1.07);z-index:4;box-shadow:0 1rem 2.4rem #000c,0 0 0 2px #fff}
.card img{width:100%;height:100%;object-fit:cover;border-radius:.45rem}
.card.poster{width:11.2rem;height:16.8rem}
.card.wide{width:24rem;height:13.5rem}
.card .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:1rem;font-weight:600;color:var(--dim);font-size:1.3rem}
.card.wide .cap{position:absolute;inset:auto 0 0 0;padding:2.6rem 1rem 1rem;border-radius:0 0 .45rem .45rem;
  background:linear-gradient(0deg,#000e,#0000)}
.card.wide .cap b{display:block;font-size:1.4rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.wide .cap span{font-size:1.17rem;color:var(--dim)}
.card.wide .bar{position:absolute;left:1rem;right:1rem;bottom:.45rem;height:.22rem;background:#fff3;border-radius:1rem;overflow:hidden}
.card.wide .bar i{display:block;height:100%;background:var(--red)}
.card.wide .go{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.card.wide:hover .go,.card.wide:focus-visible .go{opacity:1}
.card.wide .go span{width:4rem;height:4rem;border-radius:50%;background:#000a;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.card.wide .go svg{width:1.8rem;height:1.8rem;margin-left:.2rem}
.card .infob,.card .xb{position:absolute;top:.6rem;right:.6rem;width:2.2rem;height:2.2rem;border-radius:50%;background:#000a;border:1px solid #fff8;
  display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.card .xb{right:auto;left:.6rem}
.card:hover .infob,.card:hover .xb,.card:focus-visible .infob,.card:focus-visible .xb{opacity:1}
.card .infob:hover,.card .xb:hover{background:#fff;color:#000}
.card .infob svg{width:1.2rem;height:1.2rem}
.card .xb svg{width:1.05rem;height:1.05rem}
.card.tile .bg{position:absolute;inset:0}
.card.tile .bg.pv{object-position:center 18%}
.card.tile .tl{position:absolute;left:1rem;bottom:.9rem;width:auto;height:auto;max-width:56%;max-height:40%;object-fit:contain;
  object-position:left bottom;border-radius:0;z-index:1;filter:drop-shadow(0 .1rem .6rem #000)}
.card.tile .cap{padding-top:3.6rem}
.card.tile.haslogo .cap b{opacity:0}
.skel{flex:none;border-radius:.45rem;background:linear-gradient(100deg,#17171c 30%,#202027 50%,#17171c 70%);background-size:300% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-150% 0}}
#grid,.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.2rem,1fr));gap:1.6rem .8rem;padding:0 var(--pad)}
#grid .card.poster,.grid .card.poster{width:auto;height:auto;aspect-ratio:2/3}
.empty{padding:2rem var(--pad);color:var(--dim);font-size:1.43rem}

/* ---------- Somnia ---------- */
.kicker{font-size:1.23rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:1rem;text-shadow:0 .1rem .6rem #000}
.kicker span{color:#d0d0d6;font-weight:600}
.sr{padding:0 var(--pad);margin-bottom:2.6rem;display:flex;flex-direction:column;gap:1.2rem}
.srbar{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap}
.btn.roll{background:var(--red);color:#fff}.btn.roll:hover{background:var(--red2)}
.tally{font-variant-numeric:tabular-nums;color:var(--dim);font-size:1.37rem}
.note{color:var(--faint);font-size:1.23rem}
.chips{display:flex;flex-wrap:wrap;gap:.6rem}
.chip{font-size:1.3rem;color:var(--dim);padding:.5rem 1.3rem;border-radius:2rem;border:1px solid var(--line);transition:color .15s,border-color .15s,background .15s}
.chip:hover{color:var(--text);border-color:#fff6}
.chip.on{color:#fff;background:var(--red);border-color:var(--red)}
.recent{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.1rem;color:var(--faint);font-size:1.23rem;min-height:1.4rem}
.recent button{color:var(--dim);text-decoration:underline;text-underline-offset:.2em}
.recent button:hover{color:var(--text)}

/* ---------- detail ---------- */
#veil{position:fixed;inset:0;z-index:50;background:#000b;overflow-y:auto;display:none;padding:3rem 0 5rem}
#veil.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#sheet{position:relative;width:min(92vw,82rem);margin:0 auto;background:var(--panel);border-radius:.8rem;overflow:hidden;
  box-shadow:0 2rem 6rem #000;animation:rise .25s cubic-bezier(.2,.7,.3,1)}
@keyframes rise{from{transform:translateY(2rem) scale(.98);opacity:0}}
#sheet .banner{position:relative;aspect-ratio:16/8.2;background:#000 center 20%/cover}
#sheet .banner::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--panel) 0,#16161a00 46%)}
#sheet .banner .in{position:absolute;left:3rem;bottom:2.4rem;z-index:1;width:55%}
#sheet .banner .logo{max-width:24rem;max-height:8rem;object-fit:contain;object-position:left bottom;margin-bottom:1.4rem;filter:drop-shadow(0 .2rem 1rem #000a)}
#sheet .banner h1{font-family:var(--display);font-weight:400;letter-spacing:.015em;font-size:4.8rem;margin:0 0 1.2rem;line-height:.95;text-shadow:0 .2rem 1.4rem #000}
#close{position:absolute;top:1rem;right:1rem;z-index:3;width:2.6rem;height:2.6rem;border-radius:50%;background:#161619;display:flex;align-items:center;justify-content:center}
#close:hover{background:#2a2a31}
#close svg{width:1.3rem;height:1.3rem}
#sheet .body{padding:.6rem 3rem 3rem}
#sheet .about{display:grid;grid-template-columns:1.9fr 1fr;gap:2.4rem;margin-bottom:2rem}
#sheet .about p{margin:0;font-size:1.4rem;line-height:1.55;color:#dedee3;user-select:text}
#sheet .about dl{margin:0;font-size:1.23rem;line-height:1.5}
#sheet .about dt{display:inline;color:var(--faint)}
#sheet .about dd{display:inline;margin:0;color:#d5d5db}
#sheet .about div.kv{margin-bottom:.6rem}
#sheet .about .lnk{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;border-radius:.2rem}
#sheet .about .lnk:hover,#sheet .about .lnk:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:.2em;outline:0}
.sechead{display:flex;align-items:center;justify-content:space-between;margin:0 0 1rem;gap:1rem}
.sechead.gap{margin-top:2.6rem}
.sechead h3{font-size:1.8rem;margin:0}
.seasons{display:flex;flex-wrap:wrap;gap:.6rem;margin:0 0 1.2rem}
.ep{display:grid;grid-template-columns:3rem 14rem 1fr;gap:1.3rem;align-items:center;padding:1.1rem 1rem;border-bottom:1px solid var(--line);
  border-radius:.5rem;cursor:pointer;transition:background .12s;outline:0}
.ep:hover,.ep:focus-visible{background:var(--panel2)}
.ep.cur{background:#26262d}
.ep.soon{opacity:.45;cursor:default}
.ep .num{font-size:1.8rem;color:var(--dim);text-align:center}
.ep .th{position:relative;aspect-ratio:16/9;border-radius:.4rem;overflow:hidden;background:#0c0c0f}
.ep .th img{width:100%;height:100%;object-fit:cover}
.ep .th .go{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;background:#0006;transition:opacity .12s}
.ep:not(.soon):hover .th .go,.ep:focus-visible .th .go{opacity:1}
.ep .th .go svg{width:2.4rem;height:2.4rem}
.ep .th .bar{position:absolute;left:0;right:0;bottom:0;height:.25rem;background:#fff3}
.ep .th .bar i{display:block;height:100%;background:var(--red)}
.ep .tx b{font-size:1.4rem;display:flex;justify-content:space-between;gap:1rem;margin-bottom:.35rem}
.ep .tx b span{font-weight:400;color:var(--dim);font-size:1.2rem;white-space:nowrap}
.ep .tx p{margin:0;color:var(--dim);font-size:1.23rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ep .links{grid-column:3;display:flex;gap:1.6rem;margin-top:.5rem} .ep .ver,.ep .dlk{font-size:1.1rem;color:var(--faint);text-decoration:underline;text-underline-offset:.2em}
.ep .ver:hover,.ep .dlk:hover{color:var(--text)} .ep .dlk.done{color:#7ee0a1;text-decoration:none}
.ep.seen .th img{opacity:.45}
.ep .th .tick{position:absolute;top:.5rem;right:.5rem;width:1.9rem;height:1.9rem;border-radius:50%;background:#fff;color:#000;display:flex;
  align-items:center;justify-content:center;box-shadow:0 .1rem .6rem #000a}
.ep .th .tick svg{width:1.1rem;height:1.1rem}
.vlist{margin-top:.6rem}
.v{display:flex;gap:1rem;align-items:center;padding:.8rem 1rem;border-radius:.4rem;cursor:pointer;border-bottom:1px solid var(--line);outline:0}
.v:hover,.v:focus-visible{background:var(--panel2)}
.v .q{flex:none;width:11rem;font-weight:700;font-size:1.23rem;white-space:pre-line}
.v .q.cached{color:#7ee0a1}
.v .d{font-size:1.17rem;color:var(--dim);white-space:pre-line;line-height:1.4;overflow:hidden;word-break:break-word}
.similar{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem .9rem}
.similar .card.wide{width:auto;height:auto;aspect-ratio:16/9}
.similar.posters{grid-template-columns:repeat(6,1fr)}
.similar .card.poster{width:auto;height:auto;aspect-ratio:2/3}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:4rem;transform:translate(-50%,2rem);z-index:95;background:#1f1f25f2;border:1px solid var(--line);
  padding:1rem 1.6rem;border-radius:.7rem;font-size:1.43rem;display:flex;align-items:center;gap:1rem;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;box-shadow:0 1rem 3rem #000a;max-width:80vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .spin{width:1.3rem;height:1.3rem;border-radius:50%;border:.2rem solid #fff3;border-top-color:#fff;animation:sp .8s linear infinite;flex:none}
#toast.plain .spin{display:none}
@keyframes sp{to{transform:rotate(1turn)}}

/* ---------- categories ---------- */
#catBtn{display:flex;align-items:center;gap:.5rem;font-size:1.3rem;color:var(--text);border:1px solid #fff6;border-radius:.3rem;padding:.4rem 1.1rem;background:#0006;transition:border-color .15s,background .15s}
#catBtn[hidden]{display:none}
#catBtn:hover{border-color:#fff;background:#000a}
#catBtn svg{width:1.2rem;height:1.2rem}
#catMenu{position:fixed;top:5rem;z-index:40;display:none;column-count:3;column-gap:2.4rem;padding:1.1rem 1.4rem;background:#141418f7;border:1px solid var(--line);
  border-radius:.5rem;box-shadow:0 1.5rem 4rem #000c}
#catMenu.on{display:block}
#catMenu button{display:block;width:100%;text-align:left;font-size:1.3rem;color:var(--dim);padding:.42rem .2rem;white-space:nowrap}
#catMenu button:hover,#catMenu button:focus-visible{color:#fff;text-decoration:underline;text-underline-offset:.2em}
#catMenu button.on{color:#fff;font-weight:700}
.catbar{padding:0 var(--pad);margin-bottom:1.8rem}

/* ---------- top 10 ---------- */
.rank{flex:none;display:flex;align-items:flex-end}
.rank .n{font-size:17rem;line-height:.74;font-weight:800;letter-spacing:-.08em;color:var(--bg);-webkit-text-stroke:.22rem #8a8a98;
  margin-right:-.7rem;padding-left:.4rem;font-variant-numeric:lining-nums}
.rank .card{z-index:1}
.rank .card:hover{z-index:4}

/* ---------- hover preview ---------- */
#peek{position:fixed;z-index:45;width:30rem;background:var(--panel);border-radius:.6rem;overflow:hidden;opacity:0;transform:scale(.8);
  pointer-events:none;box-shadow:0 1.6rem 4.5rem #000e,0 0 0 1px #fff2;transition:opacity .16s,transform .2s cubic-bezier(.2,.7,.3,1)}
#peek.on{opacity:1;transform:none;pointer-events:auto}
#peek .pic{position:relative;aspect-ratio:16/9;background:#000 center 20%/cover;cursor:pointer}
#peek .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--panel) 0,#16161a00 48%)}
#peek .pic img{position:absolute;left:1.3rem;bottom:.9rem;z-index:1;max-width:58%;max-height:44%;object-fit:contain;object-position:left bottom;
  filter:drop-shadow(0 .1rem .6rem #000)}
#peek .pic h4{position:absolute;left:1.3rem;right:1.3rem;bottom:.8rem;z-index:1;margin:0;font-family:var(--display);font-weight:400;letter-spacing:.02em;font-size:2.7rem;line-height:.95;text-shadow:0 .1rem .8rem #000}
#peek .pb{padding:.9rem 1.3rem 1.3rem}
#peek .acts{display:flex;gap:.7rem;align-items:center;margin-bottom:1rem}
#peek .metaline{font-size:1.2rem;margin-bottom:.5rem;gap:.8rem}
#peek .gen{font-size:1.2rem;color:#d5d5db;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- starting screen ---------- */
#launch{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:#000;overflow:hidden}
#launch.on{display:flex;animation:fade .3s}
#launch .glow{position:absolute;inset:-12%;background:center 25%/cover;filter:blur(5rem) saturate(1.2) brightness(.4)}
#launch .bg{position:absolute;top:0;bottom:0;left:50%;width:min(100%,177.8vh);transform:translateX(-50%);background:center 22%/cover;opacity:.5;
  -webkit-mask-image:linear-gradient(90deg,#0000 0,#000 22%,#000 78%,#0000 100%);mask-image:linear-gradient(90deg,#0000 0,#000 22%,#000 78%,#0000 100%)}
#launch::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,#0000 0,#000b 78%)}
#launch .box{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1.5rem;text-align:center;max-width:64rem;padding:0 2rem}
#launch .logo{max-width:36rem;max-height:14rem;object-fit:contain;filter:drop-shadow(0 .3rem 1.6rem #000)}
#launch h1{margin:0;font-family:var(--display);font-size:6.8rem;line-height:.95;letter-spacing:.015em;font-weight:400;text-shadow:0 .2rem 1.6rem #000}
#launch .sub{font-size:1.8rem;color:#ececf0;text-shadow:0 .1rem .8rem #000}
#launch .st{display:flex;align-items:center;gap:1.1rem;font-size:1.45rem;color:#c9c9d1;margin-top:1rem}
#launch .spin{width:2rem;height:2rem;border-radius:50%;border:.25rem solid #fff3;border-top-color:var(--red);animation:sp .8s linear infinite;flex:none}
#launch.fail .spin{display:none}
#launch .q{font-size:1.2rem;color:var(--faint);min-height:1.5rem}
#launch .btn{display:none}
#launch.fail .btn{display:inline-flex}

/* ---------- keyboard ---------- */
button:focus-visible{outline:.18rem solid #fff;outline-offset:.22rem}
.chip:focus-visible,#tabs button:focus-visible,.recent button:focus-visible{outline-offset:.3rem}

/* ---------- hover preview: trailer ---------- */
#peek .pic{overflow:hidden}
#peek .pic iframe{position:absolute;left:0;top:50%;width:100%;aspect-ratio:16/9;border:0;transform:translateY(-50%) scale(1.22);opacity:0;
  transition:opacity .7s;pointer-events:none}
#peek .pic iframe.on.go{opacity:1}

/* ---------- downloads ---------- */
.v .vd{margin-left:auto;width:2.6rem;height:2.6rem}
.v .vd svg{width:1.25rem;height:1.25rem}
.dls{padding:0 var(--pad);display:flex;flex-direction:column;gap:.9rem}
.dl{display:grid;grid-template-columns:16rem 1fr auto;gap:1.6rem;align-items:center;max-width:84rem;background:var(--panel);border-radius:.6rem;
  padding:.9rem 1.6rem .9rem .9rem}
.dl .th{aspect-ratio:16/9;border-radius:.4rem;background:#0c0c0f center 20%/cover}
.dl .tx b{display:block;font-size:1.5rem;margin-bottom:.2rem}
.dl .tx span{display:block;font-size:1.25rem;color:var(--dim);min-height:1.6rem;margin-bottom:.8rem}
.dl .bar{height:.3rem;background:#fff2;border-radius:1rem;overflow:hidden;margin-bottom:.6rem}
.dl .bar i{display:block;height:100%;background:var(--red);transition:width .6s}
.dl.done .bar i{background:#7ee0a1}
.dl .tx small{font-size:1.15rem;color:var(--faint)}
.dl .acts{display:flex;gap:.7rem}
.rb.warn{border-color:var(--red);background:var(--red)}

/* ---------- info page: trailer in the banner ---------- */
#sheet .banner{overflow:hidden}
#sheet .banner iframe{position:absolute;left:50%;top:50%;aspect-ratio:16/9;border:0;opacity:0;transition:opacity 1s;pointer-events:none}
#sheet .banner iframe.on.go{opacity:1}
/* ---------- playing on a television ---------- */
#castBtn.on{color:var(--red2);background:#fff2}
#castMenu{position:fixed;z-index:60;display:none;min-width:24rem;background:#17171cf7;border:1px solid var(--line);border-radius:.7rem;padding:.6rem;
  box-shadow:0 1rem 3rem #000c;backdrop-filter:blur(12px)}
#castMenu.on{display:block;animation:fade .15s}
#castMenu h5{margin:.5rem .8rem .5rem;font-size:1.05rem;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
#castMenu button{display:flex;align-items:center;gap:.8rem;width:100%;padding:.8rem;border-radius:.45rem;font-size:1.3rem;text-align:left;color:var(--dim)}
#castMenu button:hover{background:#fff1;color:#fff}
#castMenu button.on{color:#fff}
#castMenu button.on::after{content:"";margin-left:auto;width:.65rem;height:.65rem;border-radius:50%;background:var(--red)}
#castMenu .note{padding:.8rem;color:var(--dim);font-size:1.2rem;line-height:1.4}
#castMenu hr{border:0;border-top:1px solid var(--line);margin:.5rem .4rem}
#launch .remote{display:none;gap:1.3rem;align-items:center;margin-top:.4rem}
#launch.cast .remote{display:flex}
#launch.cast .spin{display:none}
#launch.cast .btn{display:inline-flex}
#launch.cast .q{color:#d4d4da;font-size:1.5rem;font-variant-numeric:tabular-nums}
#launch.cast .st{font-size:1.7rem;color:#fff}
#launch .remote .rb[hidden]{display:none}
#launch .remote .rb{width:4.4rem;height:4.4rem;font-size:1.35rem;font-weight:700}
#launch .remote .rb.big{width:5.8rem;height:5.8rem;background:#fff;color:#000;border-color:#fff}
#launch .remote .rb svg{width:1.9rem;height:1.9rem}
#launch .remote .rb.big svg{width:2.5rem;height:2.5rem}
/* ---------- where some of it comes from ---------- */
.credit{padding:1rem var(--pad) 3rem;color:var(--faint);font-size:1.1rem}
/* ---------- opening ---------- */
#intro{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;animation:introOut .8s 2.3s both}
html.seen #intro{display:none}
#intro b{font-family:var(--display);font-weight:400;font-size:min(21rem,24vw);line-height:.9;color:var(--red);padding-left:.06em;
  text-shadow:0 0 7rem #e5091480;animation:introIn 2.4s cubic-bezier(.16,.8,.2,1) both}
#intro i{display:block;height:.5rem;width:min(46rem,52vw);margin-top:1.2rem;border-radius:1rem;transform-origin:center;
  background:linear-gradient(90deg,#e5091400,var(--red) 20%,#ff5a5f 50%,var(--red) 80%,#e5091400);animation:introLine 2.4s cubic-bezier(.3,.7,.2,1) both}
@keyframes introIn{0%{opacity:0;letter-spacing:.7em;transform:scale(.8);filter:blur(1.4rem)}45%{opacity:1;filter:blur(0)}
  100%{opacity:1;letter-spacing:.06em;transform:scale(1.05);filter:blur(0)}}
@keyframes introLine{0%,35%{transform:scaleX(0);opacity:0}75%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1.08);opacity:.9}}
@keyframes introOut{to{opacity:0;visibility:hidden}}
/* ================= Atrium off the PC =================
   Added after Atrium's own styles. First what holds on every device without the PC, then the
   phone layout (a narrow screen held upright), then touch screens in general. */

/* ---------- every device ---------- */
#castBtn,#dlBtn,#fsBtn,#closeBtn,#updBtn{display:none!important}
/* the Download buttons: only where VLC can do the downloading (iPhone, iPad) */
html:not(.dl-ok) [data-dl],html:not(.dl-ok) .dlk,html:not(.dl-ok) .v .vd{display:none!important}
#setBtn{margin-left:0}

#setup{position:fixed;inset:0;z-index:300;background:#000d;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 2rem) 1.6rem calc(env(safe-area-inset-bottom) + 2rem);user-select:text}
#setup .panel{width:min(100%,46rem);margin:0 auto;background:var(--panel);border-radius:1rem;padding:2.2rem;cursor:default;box-shadow:0 2rem 6rem #000}
#setup h2{font-family:var(--display);font-weight:400;letter-spacing:.03em;font-size:3.4rem;line-height:1;margin:0 0 1rem;color:var(--red)}
#setup h3{font-size:1.5rem;margin:2rem 0 .8rem}
#setup h3 small{display:block;font-weight:400;color:var(--faint);font-size:1.15rem;margin-top:.2rem}
#setup p{font-size:1.3rem;line-height:1.5;color:var(--dim);margin:0 0 1rem}
#setup .hint{color:var(--text);background:var(--panel2);border-radius:.6rem;padding:1rem 1.2rem}
#setup label{display:block;font-size:1.15rem;color:var(--dim);margin-bottom:1rem}
#setup input,#setup select{display:block;width:100%;margin-top:.4rem;padding:1rem 1.1rem;border-radius:.6rem;border:1px solid var(--line);
  background:#0b0b0d;color:var(--text);font:inherit;font-size:16px;user-select:text;-webkit-appearance:none;appearance:none}
#setup input:focus,#setup select:focus{outline:0;border-color:#fff8}
#setup summary{font-size:1.25rem;color:var(--dim);margin:1.4rem 0 1rem;cursor:pointer}
#setup .btn{justify-content:center}
#setup .foot{display:flex;gap:1rem;justify-content:flex-end;margin-top:2rem}
#setup .tvcode{font-family:var(--display);font-size:6rem;letter-spacing:.18em;text-align:center;color:#fff;background:var(--panel2);border-radius:.8rem;padding:1.2rem .6rem;margin:1rem 0}
html.tv #setup .tvcode{font-size:7rem}
#setup .ver{font-size:1.05rem;color:var(--faint);margin:1.4rem 0 0}
#setup .ver a{color:var(--dim);text-decoration:underline}

#openBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 6.5rem);z-index:96;display:flex;align-items:center;gap:.6rem;
  background:#1f1f25f7;border:1px solid var(--line);border-radius:3rem;padding:.6rem .7rem;box-shadow:0 1rem 3rem #000a;max-width:calc(100vw - 2rem)}

/* ---------- the player inside Atrium ---------- */
#vp{position:fixed;inset:0;z-index:500;background:#000;cursor:none;user-select:none}

#vp .vmsg.on{opacity:1}
#vp .vnote{position:absolute;right:5vw;top:calc(env(safe-area-inset-top) + 3rem);font-size:1.8rem;background:#000b;border-radius:.8rem;padding:1rem 1.6rem;opacity:0;transition:opacity .2s;pointer-events:none}

/* ---------- touch screens ---------- */
@media (hover:none){
  .card:hover{transform:none;box-shadow:none;z-index:auto}

  .card .infob,.card .xb{opacity:1}

}
/* a phone on its side: Atrium's own layout, with letters that stay readable */
@media (pointer:coarse) and (max-height:520px) and (min-width:701px){

/* ---------- television ----------
   Seen from the sofa: larger letters, margins that stay clear of the screen's edge, a thick ring on what the remote is on. */

/* ---------- tablet (iPad): Atrium's own wide layout, sized for fingers ----------
   Atrium scales its letters with the window, which is right for a desk and too small at arm's

/* a tablet held upright: no room for the search box beside the sections, so it folds into its icon and opens across the bar */
@media (pointer:coarse) and (min-width:701px) and (max-width:900px) and (min-height:521px){

  #tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;gap:0;justify-content:space-around;align-items:stretch;
    background:#0b0b0df2;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);

  /* banner: the picture (and the trailer) on top, the title and the buttons under it */
  #hero{height:auto;min-height:0;padding-top:70vw}
  #hero .art,#hero .vid{left:0;right:0;width:100%;height:78vw;

  .kicker{font-size:1.05rem;margin-bottom:.7rem}

  .row{margin-bottom:2rem}

  #close{position:fixed;top:calc(env(safe-area-inset-top) + .9rem);right:1rem;z-index:60;width:3.2rem;height:3.2rem;background:#000a;border:1px solid #fff3}
  #sheet .banner{aspect-ratio:auto;padding-top:calc(56.25vw + env(safe-area-inset-top));background-size:100% auto;background-position:center top;background-repeat:no-repeat;background-color:var(--panel)}
  #sheet .banner::after{background:linear-gradient(0deg,var(--panel) 0,var(--panel) calc(100% - 56.25vw - env(safe-area-inset-top)),#16161a00 calc(100% - 22vw))}

  .sechead h3{font-size:1.6rem}

/* ---------- television: lighter on the graphics chip (blurs, glass and big shadows are slow on a TV's processor) ---------- */
html.tv *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

/* the close cross of the settings screen, always in view at the top right */

/* My downloads (phone and tablet): a small picture beside the text, the buttons on a line of their own */
.dl{grid-template-columns:11rem 1fr;gap:1.2rem;padding:.9rem}

@media (min-width: 700px){ .dl{grid-template-columns:16rem 1fr auto} .dl .acts{grid-column:auto} .dl .acts .btn{flex:none} }

  <div class="st"><div class="spin"></div><span></span></div><div class="q"></div><div class="remote"><button class="rb" data-do="back" title="Back 10 seconds">-10</button><button class="rb big" data-do="toggle" title="Pause / play"></button><button class="rb" data-do="fwd" title="Forward 10 seconds">+10</button><button class="rb" data-do="mute" title="Sound off / on"></button><button class="rb" data-do="stop" title="Stop playing on the TV"></button></div><button class="btn more">Back</button></div></div>

<script>
// Atrium, off the PC.
// The home screen page asks everything it cannot do itself through one function, local(). On the
// PC that function talks to the home server. Here it is answered by this file, in the browser:
// the Stremio account, the Torrentio / TorBox add-on and TMDB are asked directly, and a video is
// handed to VLC. The sign-in keys are typed once on the device and stay in its own storage; they
// are never part of the published page.
(function () {
  'use strict';

  // ---------- what this device remembers ----------
  const mem = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { if (v == null || v === '') localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} copy.put(k, v); },
    json(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  };
  // The keys are also kept in IndexedDB, a second place on the device. If the browser empties
  // one of them (it does that to sites it thinks are unused) the other brings the sign-in back.
  const copy = {
    keys: ['atrium.m.stremio', 'atrium.m.tmdb', 'atrium.m.max'],
    open() {
      return new Promise((res, rej) => {
        try {
          const r = indexedDB.open('atrium', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('kv');
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        } catch (e) { rej(e); }
      });
    },
    pending: [],
    put(k, v) {
      if (this.keys.indexOf(k) < 0) return Promise.resolve();
      const p = (async () => {
        try {
          const db = await this.open();
          await new Promise(res => {
            const tx = db.transaction('kv', 'readwrite'), st = tx.objectStore('kv');
            tx.oncomplete = tx.onerror = tx.onabort = () => res();
            if (v == null || v === '') st.delete(k); else st.put(String(v), k);
          });
        } catch (e) {}
      })();
      this.pending.push(p);
      return p;
    },
    // wait (a moment at most) until the second copy has been written, so that a reload cannot bring back a key that was just removed
    settled() { return Promise.race([Promise.all(this.pending), new Promise(r => setTimeout(r, 1500))]); },
    async restore() {
      let back = false;
      try {
        const db = await this.open();
        for (const k of this.keys) {

    try { b = JSON.parse(body || '{}'); } catch (e) {}
    if (!isIOS) return { ok: false, error: 'downloads work on iPhone and iPad' };
    const urls = streamUrls.get(String(b.type || '') + '/' + String(b.id || '')), n = +b.n;
    if (!urls || !(n >= 0) || n >= urls.length) return { ok: false, error: 'unknown stream' };
    const url = String(urls[n]);
    if (!/^https:\/\/[A-Za-z0-9.\-]+\//.test(url) || /["\s]/.test(url)) return { ok: false, error: 'bad address' };
    const ext = (url.split('?')[0].match(/\.(mkv|mp4|m4v|avi|mov|webm|ts)$/i) || [''])[0];
    const base = String(b.name || b.title || '').replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120);
    if (dlTo() === 'files') {

      try { window.AtriumSave(url, base && ext ? base + ext : ''); } catch (e) {}
      noteDownload(b, 'files');
      return { ok: true };

    if (base && ext) href += '&filename=' + encodeURIComponent(base + ext);

  window.AtriumDlTo = dlTo;

    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

  const dlList = () => { const l = mem.json(DLS, []); return Array.isArray(l) ? l.filter(x => x && x.id && x.root && x.title) : []; };
  const dlSave = l => { try { if (l.length) localStorage.setItem(DLS, JSON.stringify(l.slice(0, 80))); else localStorage.removeItem(DLS); } catch (e) {} };
  function noteDownload(b, via) {
    try {
      const id = String(b.id || ''), root = rootId(id), title = String(b.title || '').slice(0, 120);

  // ---------- TMDB: trailers, new seasons, and titles the catalogue does not know ----------
  const TMDB = 'https://api.themoviedb.org/3/';
  async function tm(path, query) {
    const k = tmdbKey();
    let url = TMDB + path + '?' + query;
    const opt = {};
    // a long key is TMDB's "read access token", a short one its "API key"
    if (k.length > 60) opt.headers = { Authorization: 'Bearer ' + k }; else url += '&api_key=' + k;
    const r = await fetch(url, opt);
    if (!r.ok) throw new Error('TMDB ' + r.status);
    return r.json();
  }
  const tmdbIds = mem.json(K.ids, {});      // 'tv/123' or 'movie/123' -> IMDb id
  let idsDirty = false;
  const saveIds = () => {
    if (!idsDirty) return;
    idsDirty = false;
    const known = {};
    for (const k in tmdbIds) if (tmdbIds[k]) known[k] = tmdbIds[k];
    mem.set(K.ids, JSON.stringify(known));
  };
  const tmCache = new Map();
  const cached = (slot, minutes) => { const c = tmCache.get(slot); return c && Date.now() - c.at < minutes * 60000 ? c.v : null; };
  const keep = (slot, v) => { tmCache.set(slot, { at: Date.now(), v: v }); return v; };
  const img = (size, path) => (path ? 'https://image.tmdb.org/t/p/' + size + path : '');
  const year = day => { const d = String(day || ''); return d.length >= 4 ? d.slice(0, 4) : ''; };
  const flat = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');

  // The IMDb id of a TMDB title ('' when it has none).
  async function imdbOf(kind, number) {
    const key = kind + '/' + number;
    if (tmdbIds[key] != null) return tmdbIds[key];
    let imdb = '';
    try { const x = await tm(key + '/external_ids', 'language=en-CA'); if (/^tt\d+$/.test(x.imdb_id || '')) imdb = x.imdb_id; } catch (e) {}
    tmdbIds[key] = imdb;
    idsDirty = true;
    return imdb;
  }
  // 'tv/123' or 'movie/123' for an IMDb id ('' when TMDB does not know it).
  async function refOf(imdb, type) {
    for (const k in tmdbIds) if (tmdbIds[k] === imdb && /^(tv|movie)\/\d+$/.test(k)) return k;
    const slot = 'ref/' + imdb;
    if (tmCache.has(slot)) return tmCache.get(slot).v;
    const j = await tm('find/' + imdb, 'external_source=imdb_id');
    const tv = (j.tv_results || []).filter(Boolean), mv = (j.movie_results || []).filter(Boolean);
    let ref = '';
    if (type === 'movie' && mv.length) ref = 'movie/' + mv[0].id;
    else if (tv.length) ref = 'tv/' + tv[0].id;
    else if (mv.length) ref = 'movie/' + mv[0].id;
    if (ref) { tmdbIds[ref] = imdb; idsDirty = true; saveIds(); }
    return keep(slot, ref);
  }
  // The trailers to show, best first: a real trailer before a teaser, in English before French,
  // the official one, one that carries the title's own name.
  function pickTrailers(videos, title) {
    const want = flat(title), rows = [];
    (videos || []).forEach((v, i) => {
      if (!v || v.site !== 'YouTube' || !/^[A-Za-z0-9_\-]{6,20}$/.test(v.key || '')) return;
      let s = v.type === 'Trailer' ? 100 : v.type === 'Teaser' ? 40 : -1;
      if (s < 0) return;
      if (v.official) s += 20;
      if (v.iso_639_1 === 'en') s += 30; else if (v.iso_639_1 === 'fr') s += 10;
      if (want.length >= 4 && flat(v.name).indexOf(want) >= 0) s += 8;
      if (+v.size >= 1080) s += 2;
      rows.push({ key: v.key, name: String(v.name || ''), lang: String(v.iso_639_1 || ''), score: s * 1000 - (i + 1) });
    });
    return rows.sort((a, b) => b.score - a.score).slice(0, 5).map(r => ({ key: r.key, name: r.name, lang: r.lang }));
  }
  // The episodes of one season, as the home screen lists them. Episodes without a date are left out.
  function episodes(imdb, season) {
    return ((season && season.episodes) || []).filter(e => e && e.air_date).map(e => ({
      id: imdb + ':' + (+e.season_number) + ':' + (+e.episode_number), season: +e.season_number, episode: +e.episode_number, name: String(e.name || ''),
      released: e.air_date + 'T00:00:00.000Z', thumbnail: img('w300', e.still_path), overview: String(e.overview || '')
    }));
  }
  async function tmdbInfo(type, id, full) {
    if (!/^tt\d{5,10}$/.test(id) || !/^(movie|series)$/.test(type)) return { ok: false, error: 'bad request' };
    if (!tmdbKey()) return { ok: false, error: 'no key' };
    const slot = 'info/' + id + '/' + !!full, c = cached(slot, 360);
    if (c) return c;
    try {
      const ref = await refOf(id, type);
      if (!ref) return { ok: false, error: 'not at TMDB' };
      const kind = ref.split('/')[0];
      const d = await tm(ref, 'language=en-CA&append_to_response=videos,credits&include_video_language=en,fr,null');
      let about = String(d.overview || '');
      if (!about) { try { about = String((await tm(ref, 'language=fr-CA')).overview || ''); } catch (e) {} }
      let name = d.title, yr = year(d.release_date), run = d.runtime ? d.runtime + ' min' : '';
      const seasons = [], makers = [];
      if (kind === 'tv') {
        name = d.name;
        yr = year(d.first_air_date);
        if (yr) yr += d.status === 'Ended' || d.status === 'Canceled' ? '-' + year(d.last_air_date) : '-';
        const times = (d.episode_run_time || []).filter(Boolean);
        run = times.length ? times[0] + ' min' : '';
        (d.seasons || []).forEach(s => { if (s && +s.season_number >= 1 && +s.episode_count > 0) seasons.push({ n: +s.season_number, count: +s.episode_count, date: String(s.air_date || '') }); });
        (d.created_by || []).forEach(p => { if (p && p.name && makers.length < 3) makers.push(p.name); });
      } else {
        ((d.credits && d.credits.crew) || []).forEach(p => { if (p && p.job === 'Director' && makers.length < 3) makers.push(p.name); });
      }
      const people = ((d.credits && d.credits.cast) || []).filter(p => p && p.name).slice(0, 5).map(p => p.name);
      const meta = { name: String(name || ''), description: about, releaseInfo: yr, runtime: run, imdbRating: +d.vote_count > 0 ? (+d.vote_average).toFixed(1) : '',
        poster: img('w342', d.poster_path), background: img('w1280', d.backdrop_path), genres: (d.genres || []).filter(g => g && g.name).map(g => g.name), cast: people };
      if (kind === 'tv') meta.writer = makers; else meta.director = makers;
      if (full && kind === 'tv') {

  }
  async function tmdbSeason(id, n) {

    if (!tmdbKey()) return { videos: [], error: 'no key' };
    const slot = 'season/' + id + '/' + n, c = cached(slot, 30);
    if (c) return c;
    try {
      const ref = await refOf(id, 'series');
      if (!/^tv\//.test(ref)) return { videos: [], error: 'not at TMDB' };
      return keep(slot, { videos: episodes(id, await tm(ref + '/season/' + n, 'language=en-CA')) });
    } catch (e) { return { videos: [], error: 'TMDB did not answer' }; }
  }
  const asMeta = async (r, extra) => {
    const imdb = await imdbOf(r.media_type, r.id);
    if (!imdb) return null;
    const tv = r.media_type === 'tv';
    return Object.assign({ id: imdb, type: tv ? 'series' : 'movie', name: String((tv ? r.name : r.title) || ''), poster: img('w342', r.poster_path),
      background: img('w780', r.backdrop_path), description: String(r.overview || ''), releaseInfo: year(tv ? r.first_air_date : r.release_date) }, extra || {});
  };
  // Search at TMDB, which also knows titles the catalogue does not (Quebec shows, for one).
  async function tmdbSearch(text) {
    text = String(text || '').trim();
    if (text.length < 2 || text.length > 80) return { metas: [] };
    if (!tmdbKey()) return { metas: [], error: 'no key' };
    const slot = 'search/' + text.toLowerCase(), c = cached(slot, 30);
    if (c) return c;
    try {
      const j = await tm('search/multi', 'include_adult=false&language=en-CA&query=' + encodeURIComponent(text));
      const rows = (j.results || []).filter(r => r && (r.media_type === 'tv' || r.media_type === 'movie')).slice(0, 10);
      const metas = (await Promise.all(rows.map(r => asMeta(r)))).filter(Boolean);
      saveIds();
      return keep(slot, { metas: metas });
    } catch (e) { return { metas: [], error: 'TMDB did not answer' }; }
  }
  // Everything an actor played in (role 'cast'), or everything a director or creator made (role
  // 'crew'), the best known first. Talk shows, the news and appearances as themselves are left out.
  async function tmdbPerson(name, role) {
    name = String(name || '').trim();
    const crew = role === 'crew';
    if (name.length < 2 || name.length > 80) return { metas: [] };
    if (!tmdbKey()) return { metas: [], error: 'no key' };
    const slot = 'person/' + crew + '/' + name.toLowerCase(), c = cached(slot, 720);
    if (c) return c;
    try {
      const found = await tm('search/person', 'include_adult=false&language=en-CA&query=' + encodeURIComponent(name));
      const people = (found.results || []).filter(Boolean);
      const dept = crew ? /^(Directing|Writing|Creator|Production)$/ : /^Acting$/;
      const same = people.filter(p => String(p.name || '').toLowerCase() === name.toLowerCase())
        .sort((a, b) => (dept.test(b.known_for_department || '') - dept.test(a.known_for_department || '')) || ((+b.popularity || 0) - (+a.popularity || 0)));
      const p = same[0] || people[0];
      if (!p) return { metas: [], name: name };
      const credits = await tm('person/' + p.id + '/combined_credits', 'language=en-CA');
      const main = /^(Director|Creator|Showrunner)$/;
      let from = credits.cast || [];
      if (crew) from = (credits.crew || []).filter(r => r && /^(Director|Co-Director|Creator|Showrunner|Writer|Screenplay|Teleplay|Story)$/.test(r.job || ''))
        .sort((a, b) => !main.test(a.job) - !main.test(b.job));
      const rows = [], seen = {};
      for (const r of from) {
        if (!r || (r.media_type !== 'tv' && r.media_type !== 'movie') || !r.poster_path) continue;
        const key = r.media_type + '/' + r.id;
        if (seen[key]) continue;
        seen[key] = true;
        let score = +r.vote_count || 0;
        if (crew) { if (!main.test(r.job || '')) score /= 3; rows.push({ r: r, score: score }); continue; }
        if (/^\s*(self|himself|herself|themselves|host|guest|narrator \(voice\))\b/i.test(r.character || '')) continue;
        const g = r.genre_ids || [];
        if (g.indexOf(10767) >= 0 || g.indexOf(10763) >= 0 || g.indexOf(10764) >= 0) continue;
        if (r.media_type === 'tv' && +r.episode_count <= 2) score /= 6;
        rows.push({ r: r, score: score });

      const metas = (await Promise.all(top.map(x => asMeta(x.r, { character: String(x.r.character || ''), job: String(x.r.job || '') })))).filter(Boolean);
      saveIds();
      return keep(slot, { name: String(p.name || ''), picture: img('w185', p.profile_path), metas: metas });

  }

  // ---------- the answers ----------
  const NOT_HERE = { ok: false, error: 'not available on this device' };
  async function answer(path, opt) {
    const u = new URL(path, 'http://atrium.local'), q = u.searchParams, p = u.pathname;
    switch (p) {
      case '/api/library': return getLibrary();
      case '/api/library/put': { let item = null; try { item = JSON.parse(opt.body || 'null'); } catch (e) {} return putLibrary(item); }

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- signing a TV in from the phone ----------
  // The TV shows a code. The phone encrypts the sign-in with that code and leaves it on a free public message
  // service (ntfy.sh) under a name that is a hash of the code; the TV looks there, decrypts it with the code, and is signed in.
  // The service only ever holds text that cannot be read without the code.
  const RELAY = 'https://ntfy.sh/';
  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';          // no 0, O, 1, I
  const newCode = () => { const a = crypto.getRandomValues(new Uint8Array(8)); return Array.from(a, v => CODE_CHARS[v % 32]).join(''); };
  const cleanCode = t => String(t || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const goodCode = c => c.length === 8 && Array.from(c).every(ch => CODE_CHARS.indexOf(ch) >= 0);
  const showCode = c => c.slice(0, 4) + '-' + c.slice(4);
  const b64 = u => { let r = ''; for (let i = 0; i < u.length; i++) r += String.fromCharCode(u[i]); return btoa(r); };
  const unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const tvMemo = {};
  function tvCrypto(code) {
    return tvMemo[code] || (tvMemo[code] = (async () => {
      const enc = new TextEncoder();
      const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveBits']);
      // one slow derivation gives both the key and the name of the message, so the name tells nobody a cheap way to test codes
      const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode('atrium-tv-v3'), iterations: 100000, hash: 'SHA-256' }, base, 384));
      const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-GCM', false, ['encrypt', 'decrypt']);
      return { key: key, topic: 'atrium-t3-' + Array.from(bits.slice(32, 44), b => b.toString(16).padStart(2, '0')).join('') };
    })());
  }
  async function tvSend(code, payload) {
    const c = await tvCrypto(code), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, c.key, new TextEncoder().encode(JSON.stringify(payload))));
    const r = await fetch(RELAY + c.topic, { method: 'POST', body: b64(iv) + '.' + b64(ct) });
    if (!r.ok) throw new Error('relay ' + r.status);
  }
  // Roku sign-in (message type 2): the Roku has no PBKDF2 or AES-GCM, so it uses an iterated HMAC and AES-CBC with a MAC (see roku/src/source/Crypto.brs).
  const hexOf = u => Array.from(u, b => b.toString(16).padStart(2, '0')).join('');
  async function r2Keys(code) {
    const enc = new TextEncoder(), sub = crypto.subtle, alg = { name: 'HMAC', hash: 'SHA-256' };
    const ck = await sub.importKey('raw', enc.encode(code), alg, false, ['sign']);
    let u = new Uint8Array(await sub.sign('HMAC', ck, enc.encode('atrium-roku-v2')));
    for (let i = 2; i <= 30000; i++) u = new Uint8Array(await sub.sign('HMAC', ck, u));
    const kk = await sub.importKey('raw', u, alg, false, ['sign']);
    const part = async n => new Uint8Array(await sub.sign('HMAC', kk, enc.encode(n)));
    const encRaw = await part('enc'), macRaw = await part('mac'), topic = hexOf(await part('topic')).slice(0, 24);
    return {
      enc: await sub.importKey('raw', encRaw, 'AES-CBC', false, ['encrypt', 'decrypt']),
      mac: await sub.importKey('raw', macRaw, alg, false, ['sign']),
      topic: 'atrium-r2-' + topic
    };
  }
  async function r2Message(code, payload, iv) {
    const k = await r2Keys(code), enc = new TextEncoder();
    iv = iv || crypto.getRandomValues(new Uint8Array(16));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-CBC', iv: iv }, k.enc, enc.encode(JSON.stringify(payload))));
    const signed = b64(iv) + '.' + b64(ct);
    const mac = new Uint8Array(await crypto.subtle.sign('HMAC', k.mac, enc.encode(signed)));
    return { topic: k.topic, body: signed + '.' + hexOf(mac) };

  async function r2Send(code, payload) {
    const m = await r2Message(code, payload);
    const r = await fetch(RELAY + m.topic, { method: 'POST', body: m.body });

  }
  async function tvReceive(code) {
    const c = await tvCrypto(code);
    const r = await fetch(RELAY + c.topic + '/json?poll=1&since=all');
    if (r.status === 429) throw new Error('slow down');
    if (!r.ok) return null;
    const lines = (await r.text()).split('\n').filter(Boolean);
    for (let i = lines.length - 1; i >= 0; i--) {
      try {
        const m = JSON.parse(lines[i]); if (m.event !== 'message') continue;
        const parts = String(m.message).split('.');
        const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(parts[0]) }, c.key, unb64(parts[1]));
        return JSON.parse(new TextDecoder().decode(pt));
      } catch (e) {}
    }
    return null;
  }

  function openSettings(first, notice) {

// Seasons and episodes that came out after the catalogue was last brought up to date.
function tmdbSeasons(type, id, m) {
  if (type === 'movie' || !isImdb(id) || !m || m.viaTmdb) return Promise.resolve();
  if (!m.moreSeasons) m.moreSeasons = (async () => {
    const i = await tmdbInfo(type, id);
    if (!i) { delete m.moreSeasons; return; }
    m.yt = ytKeys(i);
    const vs = episodesOf(m);
    if (!vs.length || !(i.seasons || []).length) return;
    const have = {};
    let lastDay = 0;
    vs.forEach(v => { const s = seasonOf(v); have[s] = Math.max(have[s] || 0, numberOf(v) || 0); });
    const last = Math.max.apply(null, Object.keys(have).map(Number));
    vs.forEach(v => { if (seasonOf(v) === last && v.released) lastDay = Math.max(lastDay, Date.parse(v.released) || 0); });
    const want = i.seasons.filter(s => s.n > last || (s.n === last && s.count > have[last])).slice(0, 4);
    for (const s of want) {
      let j = null;
      try { j = await local('/api/tmdb/season?id=' + encodeURIComponent(id) + '&n=' + s.n); } catch (e) {}
      ((j && j.videos) || []).forEach(v => {
        if (v.season > last || (v.episode > have[last] && Date.parse(v.released) > lastDay)) m.videos.push(v);
      });
    }
  })().catch(() => {});
  return m.moreSeasons;
}

// ---------- resume data ----------
function parseResume() {
  resumeIndex = {};
  const out = [];
  for (const key in resume) {
    const v = resume[key];
    if (!v || typeof v !== 'object') continue;
    const e = { key: key, pos: +v.pos || 0, dur: +v.dur || 0, at: +v.at || 0, name: v.name || key.split('|')[0] };
    const m = key.match(/\|(?:s(\d+))?e(\d+)$/);
    if (m) {
      e.type = 'series'; e.episode = +m[2];
      e.season = m[1] ? +m[1] : null;
      // "world trigger s3" -> series "world trigger", season 3
      const sm = e.name.match(/^(.*?)\s+s(\d+)$/);
      if (sm && e.season == null) { e.name = sm[1]; e.season = +sm[2]; }
    } else {
      e.type = 'movie';
      const ym = key.match(/\s((?:19|20)\d\d)$/);
      if (ym) e.year = ym[1];
    }
    (resumeIndex[loose(e.name)] = resumeIndex[loose(e.name)] || []).push(e);
    out.push(e);
  }
  return out;
}
function progressFor(name, season, episode, oneSeason) {
  const list = resumeIndex[loose(name)];
  if (!list) return null;
  for (const e of list) {
    if (episode == null) { if (e.type === 'movie') return e; continue; }
    if (e.episode !== episode) continue;
    if (e.season === season || (e.season == null && oneSeason)) return e;
  }
  return null;
}

// Finds the catalogue entry (id, pictures) for a title the player remembers.
async function resolve(e) {
  const ids = store.get('home.ids', {});
  const ck = e.type + ':' + loose(e.name) + (e.year || '');
  if (ids[ck]) return ids[ck];
  let hit = null;
  const lib = library.find(x => loose(x.name) === loose(e.name) && (x.type === 'movie') === (e.type === 'movie'));
  if (lib) hit = { id: lib._id, type: lib.type, name: lib.name, poster: lib.poster };
  if (!hit) {
    try {
      const j = await getJSON(CM + '/catalog/' + e.type + '/top/search=' + encodeURIComponent(e.name) + '.json');
      const metas = j.metas || [];
      let m = metas.find(x => loose(x.name) === loose(e.name) && (!e.year || String(x.releaseInfo || '').indexOf(e.year) === 0));
      if (!m) m = metas.find(x => loose(x.name) === loose(e.name));
      if (!m && metas.length && loose(metas[0].name).indexOf(loose(e.name)) === 0) m = metas[0];
      if (m) hit = { id: m.id, type: e.type, name: m.name, poster: m.poster };
    } catch (err) {}
  }
  if (hit) { ids[ck] = hit; store.set('home.ids', ids); }
  return hit;
}

// "Continue watching" comes from two places. The player remembers the exact second of what it
// played on this PC. The Stremio library knows what was left unfinished on any device, and it
// moves on to the next episode when one is finished. Whichever is more recent wins.
async function fromPlayer(e) {
  const hit = await resolve(e);
  if (!hit) return null;
  const imdb = isImdb(hit.id);
  let season = e.season == null ? 1 : e.season, number = e.episode;
  const it = { id: hit.id, type: hit.type, name: hit.name, poster: hit.poster, resume: e, stamp: e.at || 0 };
  if (e.type !== 'movie') {
    if (imdb && e.season == null) {
      // No season in the file name (anime numbering): find which season that episode falls in.
      try {
        const vs = ((await getMeta(hit.type, hit.id)).videos || []).filter(v => v.season > 0)
          .sort((a, b) => a.season - b.season || (a.episode || a.number) - (b.episode || b.number));
        const v = vs.find(x => x.season === 1 && (x.episode || x.number) === e.episode) || vs[e.episode - 1];
        if (v) { season = v.season; number = v.episode || v.number; }
      } catch (err) {}
    }
    it.season = season; it.episode = e.episode;
    it.videoId = hit.id + (imdb ? ':' + season : '') + ':' + number;
    it.sub = (e.season != null ? 'S' + season + ' : ' : '') + 'E' + e.episode;
    it.thumb = imdb ? 'https://episodes.metahub.space/' + hit.id + '/' + season + '/' + number + '/w780.jpg' : null;
  } else {
    it.videoId = hit.id;
    it.sub = e.year || 'Movie';
  }
  it.back = imdb ? backOf({ id: hit.id }) : hit.poster;
  if (!imdb) {
    try {
      const km = await getMeta(hit.type, hit.id);
      if (km.background) it.back = km.background;
      const kv = (km.videos || []).find(v => (v.episode || v.number) === e.episode);
      if (kv && kv.thumbnail) it.thumb = kv.thumbnail;
    } catch (err) {}
  }
  return it;
}
async function fromStremio(x) {

  const it = { id: id, type: x.type, name: x.name, poster: x.poster, lib: true, videoId: String(st.video_id),
    stamp: Math.floor(Date.parse(st.lastWatched || x._mtime || '') / 1000) || 0, back: backOf({ id: id }) || x.poster };
  it.next = off < 5000;       // Stremio marks "start the next episode" with an offset of 1 ms
  it.resume = it.next ? { pos: 0, dur: 0 } : { pos: off / 1000, dur: dur / 1000 };
  if (!it.next) it.startAt = Math.floor(off / 1000);
  if (x.type === 'movie') {
    if (it.next || (dur && off / dur > 0.93)) return null;   // nothing to start, or only the credits were left
    it.sub = x.year || 'Movie';
    return it;
  }
  const p = it.videoId.split(':');
  const ep = +p[p.length - 1], season = imdb ? +p[1] : 1;
  if (!ep) return null;
  let m;
  try { m = await getMeta(x.type, id); } catch (e) { return null; }
  const vs = (m && m.videos) || [];
  const v = vs.find(y => y.id === it.videoId) || vs.find(y => (!imdb || y.season === season) && (y.episode || y.number) === ep);
  if (!v || (v.released && Date.parse(v.released) > Date.now())) return null;   // that episode is not out yet
  it.season = season; it.episode = ep;
  it.sub = (imdb ? 'S' + season + ' : ' : '') + 'E' + ep;
  it.thumb = v.thumbnail || (imdb ? 'https://episodes.metahub.space/' + id + '/' + season + '/' + ep + '/w780.jpg' : null);

}
async function continueItems() {
  const all = parseResume();
  const latest = {};
  for (const e of all) {
    const k = e.type + ':' + loose(e.name);
    if (!latest[k] || e.at > latest[k].at || (e.at === latest[k].at && e.episode > latest[k].episode)) latest[k] = e;
  }
  const mine = Object.values(latest).sort((a, b) => b.at - a.at).slice(0, 24);
  const theirs = library.filter(x => x.state && x.state.video_id && +x.state.timeOffset > 0 && (!x.removed || x.temp))
    .sort((a, b) => String(b.state.lastWatched || '').localeCompare(String(a.state.lastWatched || ''))).slice(0, 14);
  const got = (await Promise.all(mine.map(fromPlayer).concat(theirs.map(fromStremio)))).filter(Boolean);
  // One card per title. On a near tie the player's own memory wins: it knows the exact second.
  const byId = {};
  for (const it of got) {
    const o = byId[it.id];
    if (!o || it.stamp > o.stamp + 90 || (!it.lib && it.stamp >= o.stamp - 90)) byId[it.id] = it;
  }
  const hidden = store.get('jey.hidden', {});
  return Object.values(byId).filter(it => !(it.id in hidden) || it.stamp > hidden[it.id])
    .sort((a, b) => b.stamp - a.stamp).slice(0, 24);
}

// A "Top 10" row: the ten most popular titles right now, each with its rank.
function topRow(title, types) {
  const row = makeRow(title);
  const strip = $('.strip', row);
  skeletons(strip, 10);
  row._load = async () => {
    try {
      const lists = await Promise.all(types.map(topList));
      // One list: its first ten. Series and films together: taken in turn, so each keeps its own order.
      const top = [];
      for (let i = 0; i < 10 && top.length < 10; i++) lists.forEach(l => { if (l[i] && top.length < 10) top.push(l[i]); });
      strip.innerHTML = '';
      top.forEach((m, i) => {
        const w = el('<div class="rank"><span class="n">' + (i + 1) + '</span></div>');
        w.appendChild(posterCard(m));
        strip.appendChild(w);
      });
      if (!strip.children.length) row.remove();
    } catch (e) { row.remove(); }
  };
  lazy.observe(row);
  return row;
}

// ---------- hero ----------
// The banner walks through a few titles. After a moment it plays the trailer behind the title,
// with sound, to its end; when there is no trailer, or it will not play, the still simply stays.
const hero = { list: [], i: 0, age: 0, hold: false, frame: null, loaded: false, heard: false, playing: false, wait: 0, tried: false };
const YT = 'https://www.youtube-nocookie.com'; const TRAILER_FIX = { tt1844624: 'gQf4Vya5PbI' };   // where the catalogue lists another show's trailer
// A few words to the home server about each trailer (which one, whether it played), kept there in
// memory, so that one that did not play can be looked into.
const trace = () => {};
const ytBad = new Set();     // trailers that would not play: the next one in line is used instead, for ten minutes
const ytFail = id => { if (!id) return; ytBad.add(id); setTimeout(() => ytBad.delete(id), 600000); };
function trailerId(m) {
  if (TRAILER_FIX[m.id]) return TRAILER_FIX[m.id];
  const mine = (m.yt || []).filter(k => !ytBad.has(k.replace(/^-/, '')));      // TMDB's, best first
  const y = mine.find(k => k[0] !== '-');
  if (y) return y;
  const t = (m.trailers || []).find(x => x && x.source && !ytBad.has(x.source));
  if (t) return t.source;
  const s = (m.trailerStreams || []).find(x => x && x.ytId && !ytBad.has(x.ytId));
  if (s) return s.ytId;

window.addEventListener('message', ev => {
  if (ev.origin !== YT || !hero.frame || ev.source !== $('iframe', hero.frame).contentWindow) return;
  let d;
  try { d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; } catch (e) { return; }
  if (!d) return;
  if (d.event === 'onError') trace('banner error', JSON.stringify(d.info));
  if (!hero.heard) { hero.heard = true; trace('banner player answered'); trailerSend('addEventListener', ['onStateChange']); trailerSend('addEventListener', ['onError']); }
  const st = d.event === 'onStateChange' ? d.info : (d.event === 'infoDelivery' && d.info && typeof d.info.playerState === 'number' ? d.info.playerState : null);
  if (d.event === 'onError') {     // will not play here: the next trailer in line is tried, else the still stays
    ytFail($('iframe', hero.frame).dataset.yt); trailerStop(); hero.tried = false; return;
  }
  if (st != null && st !== hero.lastState) { hero.lastState = st; trace('banner state', st); }
  if (st === 0) { trailerOver(); return; }
  if (st === 1 && !hero.playing) {
    hero.playing = true;
    const box = hero.frame;
    // a moment later, so the player's own title strip has gone
    setTimeout(() => { if (hero.frame === box) { box.classList.add('on'); $('#hero').classList.add('playing'); } }, 1200);
  }
});

  if (!hero.list.length) return;
  if (heroBlocked()) {

    if (hero.frame) { trailerStop(); hero.tried = false; }
    hero.age = Math.min(hero.age, 1);

  hero.age++;
  if (hero.frame) {
    if (!hero.playing) { if (!hero.heard) trailerSend(); if (++hero.wait > 10) { trace('banner gave up waiting, answered:', hero.heard, 'loaded:', hero.loaded); trailerStop(); } }
    return;
  }
  if (!hero.tried && hero.age >= 1 && store.get('jey.trailers', true)) { trailerStart(); return; }

// Stremio keeps one bit per episode: "<an episode id>:<its place in the list>:<the bits, zipped>".
// The player sets the bit when you finish an episode, so the ticks here follow what you watch.
let detailNow = null;      // what the open info sheet shows, so it can be redrawn when you come back from the player
async function watchedIds(id, m) {
  const out = new Set();
  const w = String(((library.find(x => x._id === id) || {}).state || {}).watched || '');
  const parts = w.split(':');
  if (parts.length < 3) return out;
  const zipped = parts.pop(), place = +parts.pop(), anchor = parts.join(':');
  const ids = (m.videos || []).map(v => v.id);
  const at = ids.indexOf(anchor);
  if (at < 0 || !place) return out;
  let bits;
  try {
    const raw = Uint8Array.from(atob(zipped), c => c.charCodeAt(0));
    bits = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());
  } catch (e) { return out; }
  // if episodes were added to the list since, the bits are shifted so that the anchor still lines up
  const shift = place - 1 - at;
  ids.forEach((v, i) => { const j = i + shift; if (j >= 0 && (j >> 3) < bits.length && (bits[j >> 3] >> (j & 7)) & 1) out.add(v); });
  return out;
}

// "More like this": the most popular titles of the same two main genres, best match first
// (shared genres, shared cast or director, made around the same time).
async function moreLike(type, m, box, seq) {
  const kitsu = /^kitsu/.test(m.id || '');
  const genres = [].concat(m.genres || m.genre || []).filter(Boolean);
  if (!genres.length) return;
  const t = type === 'movie' ? 'movie' : 'series';
  const url = g => kitsu ? KITSU + '/catalog/anime/kitsu-anime-popular/genre=' + encodeURIComponent(g.toLowerCase().replace(/ /g, '-')) + '.json'
    : CM + '/catalog/' + t + '/top/genre=' + encodeURIComponent(g) + '.json';
  const lists = await Promise.all(genres.slice(0, 2).map(g => getJSON(url(g)).then(j => j.metas || []).catch(() => [])));
  if (seq !== detailSeq) return;
  const mine = new Set(genres.map(loose));
  const people = new Set([].concat(m.cast || [], m.director || [], m.writer || []).map(loose));
  const year = parseInt(m.releaseInfo || m.year, 10) || 0;
  const seen = new Map();
  lists.forEach(l => l.forEach((x, i) => {
    if (!x || !x.id || x.id === m.id) return;
    const had = seen.get(x.id);
    if (had) { had.score += 3; had.rank = Math.min(had.rank, i); return; }      // popular in both genres
    const s = { m: x, score: 0, rank: i };
    [].concat(x.genres || x.genre || []).forEach(g => { if (mine.has(loose(g))) s.score += 2; });
    [].concat(x.cast || [], x.director || [], x.writer || []).forEach(p => { if (people.has(loose(p))) s.score += 3; });
    const y = parseInt(x.releaseInfo || x.year, 10) || 0;
    if (year && y && Math.abs(year - y) <= 6) s.score += 1;
    seen.set(x.id, s);
  }));
  const picks = Array.from(seen.values()).sort((a, b) => b.score - a.score || a.rank - b.rank).slice(0, 12);
  if (!picks.length) return;
  box.appendChild(el('<div class="sechead gap"><h3>More like this</h3></div>'));
  const grid = el('<div class="similar' + (kitsu ? ' posters' : '') + '"></div>');
  picks.forEach(p => grid.appendChild(kitsu ? posterCard(p.m) : tileCard(p.m)));
  box.appendChild(grid);
}

function sizeGB(s) {
  const m = String(s.title || s.description || '').match(/([\d.]+)\s*(GB|MB)/i);
  if (!m) return 0;
  return m[2].toUpperCase() === 'GB' ? +m[1] : +m[1] / 1024;
}
// Higher is better: ready on TorBox first, then resolution, then HDR and file quality.
// The sharpest picture this PC plays smoothly (2160 or 1080 lines), from its graphics card; the
// home server works it out once. Above it a version is only chosen when there is no other.
let deviceMax = 2160;
function score(s) {
  const name = String(s.name || '');
  const t = (name + ' ' + (s.title || s.description || '') + ' ' + ((s.behaviorHints || {}).filename || '')).toLowerCase();
  let v = 0;
  if (/\[tb\+\]|\[tb\s*⚡|instant/i.test(name)) v += 10000;
  if (/download/i.test(name)) v -= 4000;
  if (/2160p|\b4k\b|uhd/.test(t)) v += deviceMax < 2160 ? -600 : 400; else if (/1080p/.test(t)) v += 300; else if (/720p/.test(t)) v += 200; else if (/480p/.test(t)) v += 100;
  if (/\b(cam|hdcam|camrip|telesync|hdts|ts|tc|scr|screener)\b/.test(t)) v -= 3000;
  if (/hdr|dolby vision|\bdv\b/.test(t)) v += 40;
  if (/remux/.test(t)) v += 25; else if (/blu-?ray|bdrip|brrip/.test(t)) v += 15; else if (/web-?dl|webrip/.test(t)) v += 10;
  if (/\b3d\b/.test(t)) v -= 500;
  if (/\b(ita|ger|german|spa|latino|rus|hindi|pol|tur|por|dublado)\b/.test(t) && !/\b(eng|english|multi)\b/.test(t)) v -= 150; else if (/\b(french|truefrench|vff|vfq|vf|vostfr)\b/.test(t) && !/\b(eng|english|multi)\b/.test(t)) v -= 30; if (/\b(dubbed|english dub|dub)\b/.test(t) && !/\b(dual|multi)\b/.test(t)) v -= 30;
  v += Math.min(sizeGB(s), 60) / 3;
  return v;
}
// "4k HDR · 18.2 GB"
function quality(s) {
  const q = String(s.name || '').replace(/^\[[^\]]*\]\s*/, '').replace(/torrentio\s*/i, '').replace(/\s+/g, ' ').trim();
  const gb = sizeGB(s);
  return [q, gb ? (gb >= 10 ? Math.round(gb) : gb.toFixed(1)) + ' GB' : ''].filter(Boolean).join(' · ');
}
const streamsCache = new Map();
function getStreams(type, id) {
  const key = type + '/' + id;
  if (!streamsCache.has(key)) {
    streamsCache.set(key, local('/api/streams?type=' + encodeURIComponent(type) + '&id=' + encodeURIComponent(id)).then(j => {
      const list = (j.streams || []).filter(s => typeof s.n === 'number');
      list.sort((a, b) => score(b) - score(a));
      list.error = j.error;
      return list;
    }).catch(e => { streamsCache.delete(key); throw e; }));
    setTimeout(() => streamsCache.delete(key), 10 * 60 * 1000);
  }
  return streamsCache.get(key);
}
// info: { name, sub, back, start } - what the starting screen shows, and where to start from.
async function start(type, id, n, info, stream) {
  info = info || {};
  if (cast.tv) { castPlay(type, id, info, n, stream); return; }
  launch.show(info, id);
  launch.status('Starting the player…', stream ? quality(stream) : '');

    const at = info.start > 5 ? '&t=' + Math.floor(info.start) : '';
    const r = await local('/api/play?type=' + encodeURIComponent(type) + '&id=' + encodeURIComponent(id) + '&n=' + n + at, { method: 'POST', body: JSON.stringify({ name: info.name || '', sub: info.sub || '' }) });
    if (!r.ok) { streamsCache.delete(type + '/' + id); launch.fail('Could not start the player (' + (r.error || 'unknown') + ').'); return; }
    launch.opened();
  } catch (e) { launch.fail('No answer. Check the connection and try again.'); }
}
async function play(type, id, info) { if (dlDone(id)) { playFile(id, info); return; }

    'Super Power', 'Supernatural', 'Thriller', 'Vampire']

const SORTS = {

  series: [['top', 'Most popular'], ['imdbRating', 'Top rated'], ['latest', 'Latest']],

const cat = {}, catSort = {};
let catSeq = 0;

function renderCategory(type, genre) {
  const rows = $('#rows');
  const seq = ++catSeq;
  heroOff();
  rows.classList.add('flat');
  const sort = catSort[type] || SORTS[type][0][0];
  const section = type === 'movie' ? 'Movies' : type === 'anime' ? 'Animes' : 'TV Shows';
  const bar = el('<div class="catbar"><div class="chips"></div></div>');
  SORTS[type].forEach(s => {
    const c = el('<button class="chip' + (s[0] === sort ? ' on' : '') + '">' + s[1] + '</button>');
    c.onclick = () => { catSort[type] = s[0]; render(); };

  });
  const grid = el('<div id="grid"></div>');
  const more = el('<div style="height:1px"></div>');
  rows.appendChild(el('<div class="row"><h2>' + section + ' · ' + esc(genre) + '</h2></div>'));
  rows.appendChild(bar); rows.appendChild(grid); rows.appendChild(more);

  const base = type === 'anime' ? KITSU : CM;
  const seen = new Set();
  // "Latest": the catalogues have no newest-first list per category. For films and series this
  // goes through this year's titles, then last year's and so on, and keeps those of the category.
  // For anime it takes the 160 most popular of the category and puts the newest first.

  async function load() {
    if (busy || done) return;

    busy = true;
    try {
      if (latest && type === 'anime') {
        const g = encodeURIComponent(genre.toLowerCase().replace(/ /g, '-'));
        const got = await Promise.all([0, 20, 40, 60, 80, 100, 120, 140].map(n =>
          getJSON(KITSU + '/catalog/anime/kitsu-anime-popular/genre=' + g + (n ? '&skip=' + n : '') + '.json').then(j => j.metas || []).catch(() => [])));
        if (seq !== catSeq) return;
        const all = [];
        got.forEach(l => l.forEach(m => { if (!seen.has(m.id)) { seen.add(m.id); all.push(m); } }));
        all.sort((a, b) => (parseInt(b.releaseInfo, 10) || 0) - (parseInt(a.releaseInfo, 10) || 0));
        all.forEach(m => grid.appendChild(posterCard(m)));
        done = true; busy = false;
        if (!all.length) rows.appendChild(el('<div class="empty">Nothing in this category.</div>'));
        return;
      }
      const url = latest ? CM + '/catalog/' + type + '/year/genre=' + year + (skip ? '&skip=' + skip : '') + '.json'
        : base + '/catalog/' + type + '/' + sort + '/genre=' + encodeURIComponent(type === 'anime' ? genre.toLowerCase().replace(/ /g, '-') : genre) + (skip ? '&skip=' + skip : '') + '.json';
      const j = await getJSON(url);
      if (seq !== catSeq) return;
      const metas = j.metas || [];
      const fits = m => !latest || [].concat(m.genres || m.genre || []).indexOf(genre) >= 0;
      metas.forEach(m => { if (!seen.has(m.id) && fits(m)) { seen.add(m.id); grid.appendChild(posterCard(m)); } });
      skip += metas.length;
      if (latest) {
        if (!metas.length || skip >= 600) { year--; skip = 0; }

      } else {
        stale = seen.size > uniq ? 0 : stale + 1; uniq = seen.size;
        if (!metas.length || stale > 1 || skip >= 1000) done = true;
      }
    } catch (e) { if (latest && year > thisYear - 8) { year--; skip = 0; pages++; } else done = true; }
    busy = false;
    if (done && !grid.children.length) rows.appendChild(el('<div class="empty">Nothing in this category.</div>'));
    // Keep going until the screen is full.
    if (!done && more.getBoundingClientRect().top < window.innerHeight + 800) load();
  }
  const watch = new IntersectionObserver(en => { if (en[0].isIntersecting) load(); }, { rootMargin: '800px 0px' });
  watch.observe(more);
  load();
}

// ---------- updates ----------
// A copy of Atrium given to a friend looks a few times a day for a newer version. When there is
// one, an Update button appears at the top: it downloads the new version, checks that it really
// comes from the PC that made the copy, puts it in place and starts Atrium again. Lists, keys,
// watch positions and downloads stay as they are. (On the PC that makes them, nothing shows.)
const upd = { info: null, busy: false, told: '' };

  upd.info = j;
  if (j && j.current) $('#brand').title = 'Atrium ' + j.current;
  const b = $('#updBtn');
  b.hidden = !(j && j.enabled && j.available);

  b.title = 'Atrium ' + j.latest + ' is ready' + (j.notes ? ': ' + j.notes : '') + ' (you have ' + j.current + ')';

  try { await local('/api/restart'); } catch (e) {}
  // back as soon as the new server answers
  const t0 = Date.now();
  const again = async () => {
    try { const res = await fetch('/', { cache: 'no-store' }); if (res.ok) { location.reload(); return; } } catch (e) {}

// ---------- trailers: the info page, and picture quality ----------
// YouTube chooses the picture quality from the size of its player. So every trailer's player is
// made as large as a 4K picture and shrunk to fit its place, and it is then asked for the sharpest
// version the trailer has.

// YouTube lays its own pause button over the first seconds of a video. A trailer stays behind the

const SHOW_AFTER = 4.6;
function showFrame(source) {

  if (f && !f.dataset.shown) { f.dataset.shown = '1'; trace('trailer shown', f.dataset.yt || ''); }
  if (f) (f.closest('.vid') || f).classList.add('go');
}
window.addEventListener('resize', () => $$('iframe[data-zoom]').forEach(f => sharp(f, +f.dataset.zoom)));
window.addEventListener('message', ev => {
  if (ev.origin !== YT) return;
  let d;
  try { d = typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data; } catch (e) { return; }
  if (d && d.info && d.info.currentTime >= SHOW_AFTER) showFrame(ev.source);
  const f = $$('iframe[data-zoom]').find(x => x.contentWindow === ev.source);
  const st = d && (d.event === 'onStateChange' ? d.info : (d.event === 'infoDelivery' && d.info && typeof d.info.playerState === 'number' ? d.info.playerState : null));
  if (f && st === 1 && !f.dataset.playing) { f.dataset.playing = '1'; soundTick(); }
  if (f && st === 2 && f.loud) {
    // The browser would not let it play with sound before a click or a key: silent until then.
    tsound.blocked = true; f.loud = false;
    ytCmd(f, 'mute'); ytCmd(f, 'playVideo');
    trace('trailer sound blocked until a click');
    soundTick();
  }
  const levels = d && d.info && d.info.availableQualityLevels;
  if (!levels || !levels.length) return;
  const best = levels.find(q => q !== 'auto');
  if (!f || !best || f.dataset.best === best) return;
  f.dataset.best = best;
  try { f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'setPlaybackQualityRange', args: [best, best], id: 'jey', channel: 'widget' }), YT); } catch (e) {}
});

// ---------- trailer sound ----------
// Trailers play with sound (the button on each one, or M, switches it off and on again for all of

// a page start sound only after a click or a key on it; until then the trailer plays silently and
// its sound comes on with the first click or key.
const tsound = { on: store.get('jey.trailerSound', true), blocked: false };
const audible = () => tsound.on && !tsound.blocked;
function ytCmd(f, func, args) {
  try { f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: args || [], id: 'jey', channel: 'widget' }), YT); } catch (e) {}

function soundTick() {

  frames.forEach(f => {

// ---------- rows: sliding with the mouse ----------
// No arrows: resting the mouse on the left or right end of a row slides it that way, faster the
// closer the mouse is to the edge of the screen. It stops as soon as the mouse leaves that end.
function edgeScroll(zone, strip, dir) {
  let x = 0, raf = 0, wait = 0, last = 0;
  const step = now => {
    const r = zone.getBoundingClientRect();
    const depth = Math.max(0, Math.min(1, dir > 0 ? (x - r.left) / r.width : (r.right - x) / r.width));
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    const dt = Math.min(50, now - last);
    last = now;
    strip.scrollBy({ left: dir * rem * (30 + 150 * depth) * dt / 1000, behavior: 'instant' });
    raf = requestAnimationFrame(step);
  };
  const stop = () => { clearTimeout(wait); cancelAnimationFrame(raf); wait = raf = 0; };
  zone.addEventListener('mouseenter', ev => {
    x = ev.clientX;
    stop();
    // a short pause, so that a mouse only passing by moves nothing
    wait = setTimeout(() => { peekHide(); last = performance.now(); raf = requestAnimationFrame(step); }, 160);
  });
  zone.addEventListener('mousemove', ev => { x = ev.clientX; });
  zone.addEventListener('mouseleave', stop);
}

// ---------- playing on a television ----------

const castAsk = (what, t) => local('/api/cast/remote?ip=' + encodeURIComponent(cast.tv.ip) + '&do=' + what + (t != null ? '&t=' + Math.floor(t) : ''),
  what === 'status' ? {} : { method: 'POST', body: '{}' });

// info: what the starting screen shows. n and stream: a version you picked yourself.

  const where = 'type=' + encodeURIComponent(type) + '&id=' + encodeURIComponent(id) + '&ip=' + encodeURIComponent(tv.ip) + (info.start > 5 ? '&t=' + Math.floor(info.start) : '');

  cast.s = s;
  castPaint();
  if (cast.idle >= 3) { launch.hide(); toast('Nothing is playing on ' + cast.tv.name + ' any more'); }
}
async function castRemote(fresh) {
  if (!cast.tv) return;
  const L = $('#launch');
  if (!fresh) {
    let s = null;
    try { s = await castAsk('status'); } catch (e) {}
    if (!s || !s.ok || s.state === 'idle') { toast('Nothing is playing on ' + cast.tv.name); return; }
    launch.show({ name: s.title || cast.tv.name }, 'cast');
    cast.s = s;
  } else {
    cast.s = { state: 'buffering', pos: 0, dur: 0 };
  }
  launch.state = 'cast'; cast.idle = 0;
  L.classList.remove('fail');
  L.classList.add('on', 'cast');
  castPaint();
  clearInterval(cast.poll);
  cast.poll = setInterval(castTick, 2000);
  castTick();
  $('#launch [data-do=toggle]').focus({ preventScroll: true });
}
$$('#launch .remote button').forEach(b => {
  b.onclick = async () => {
    const s = cast.s || {}, what = b.dataset.do;
    try {
      const take = r => { if (r && r.ok) cast.s = Object.assign({}, s, r, { dur: r.dur || s.dur, title: r.title || s.title }); };
      if (what === 'toggle') take(await castAsk(s.state === 'paused' ? 'play' : 'pause'));
      else if (what === 'back') take(await castAsk('seek', Math.max(0, (s.pos || 0) - 10)));
      else if (what === 'fwd') take(await castAsk('seek', (s.pos || 0) + 10));
      else if (what === 'mute') { const m = await castAsk(cast.muted ? 'unmute' : 'mute'); cast.muted = !!m.muted; }
      else if (what === 'stop') { await castAsk('stop'); launch.hide(); toast('Stopped on ' + cast.tv.name); return; }
    } catch (e) {}
    castPaint();
  };
});
castDraw();

boot();
</script>
</body>
