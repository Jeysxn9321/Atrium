name: Atrium
options:
  bundleIdPrefix: app.atrium
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
targets:
  Atrium:
    type: application
    platform: iOS
    sources:
      - Atrium
    info:
      path: Atrium/Info.plist
      properties:
        CFBundleDisplayName: Atrium
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - atrium
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: Launch
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.atrium.iphone
        PRODUCT_NAME: Atrium
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: AtriumWidgets
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Atrium/Info.plist
        CODE_SIGN_ENTITLEMENTS: Atrium/Atrium.entitlements

  AtriumWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AtriumWidgets
    info:
      path: AtriumWidgets/Info.plist
      properties:
        CFBundleDisplayName: Atrium Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.atrium.iphone.widgets
        PRODUCT_NAME: AtriumWidgets
        INFOPLIST_FILE: AtriumWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: AtriumWidgets/AtriumWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
